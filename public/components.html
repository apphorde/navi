<template component="navi-app">
  <main class="app">
    <file-nav bind-items="items" bind-open="navOpen" on-select="select($event)" on-refresh="loadTree()" on-new-file="newFile()" on-close="closeNav()" bind-user="user"></file-nav>
    <section class="panel workspace">
      <header class="bar"><button class="icon mobile-menu" on-click="openNav()">☰</button><div class="crumb"><span>data</span><span>/</span><strong>{{ selected?.path || 'Select a file' }}</strong></div><div><button class="icon" on-click="openNav()" aria-label="Open navigation">⌕</button></div></header>
      <nav class="tabs"><button class="tab" class-active="mode === 'preview'" on-click="setMode('preview')">Preview</button><button class="tab" class-active="mode === 'editor'" on-click="setMode('editor')">Editor</button></nav>
      <div class="content"><template if="selected"><file-workspace bind-file="selected" bind-mode="mode" on-save="save($event)"></file-workspace></template><template if="!selected"><div class="empty">Select a text file to begin</div></template></div>
      <footer class="status"><span class="saved-dot"></span>{{ saveStatus }}<span>UTF-8</span><span>{{ selected?.lineEnding || 'LF' }}</span><span>{{ selected?.language || '' }}</span></footer>
    </section>
    <aside class="info-panel"><template if="selected"><file-info bind-file="selected"></file-info></template><template if="aiEnabled"><ai-assistant bind-file="selected" on-settings="showPrompt()"></ai-assistant></template></aside>
    <template if="promptOpen"><ai-prompt-modal bind-value="prompt" on-close="closePrompt()" on-save="savePrompt($event)"></ai-prompt-modal></template>
  </main>
  <script setup src="/navi-app.js"></script>
</template>

<template component="file-nav">
  <aside class="nav-panel" class-open="open"><header class="bar"><strong class="brand">vault<i>.</i>server</strong><button class="icon close-nav" on-click="$$emit('close')">×</button></header><div class="server"><span class="dot"></span><div><strong>mounted data</strong><small class="muted small">/home/app/data</small></div></div><div class="explorer-head"><span>Explorer</span><div><button class="icon" on-click="$$emit('new-file')">＋</button><button class="icon" on-click="$$emit('refresh')">↻</button></div></div><div class="tree"><template for="item of items"><file-tree-item bind-item="item" on-select="$$emit('select', $event)"></file-tree-item></template></div><div class="user"><span class="avatar">•</span><div><strong>{{ user?.name || 'User' }}</strong><small class="muted small">{{ user?.role || 'member' }}</small></div><a class="icon" href="/auth/logout">⋯</a></div></aside>
  <script setup src="/file-nav.js"></script>
</template>

<template component="file-tree-item"><button class="tree-row" style-padding-left="(item.depth * 16 + 12) + 'px'" on-click="select()"><span>{{ item.type === 'directory' ? (item.open ? '⌄' : '›') : '·' }}</span><span bind-class="{ folder: item.type === 'directory', file: item.type !== 'directory' }">{{ item.type === 'directory' ? '▰' : '□' }}</span><span>{{ item.name }}</span></button><template if="item.open"><template for="child of item.children"><file-tree-item bind-item="child" on-select="$$emit('select', $event)"></file-tree-item></template></template><script setup src="/file-tree-item.js"></script></template>

<template component="file-workspace"><div class="editor-wrap"><template if="mode === 'editor'"><file-editor bind-file="file" on-change="$$emit('save', $event)"></file-editor></template><template if="mode === 'preview'"><file-preview bind-file="file"></file-preview></template></div><script setup src="/file-workspace.js"></script></template>
<template component="file-editor"><div class="editor-wrap"><code-editor bind-value="file.content" bind-language="file.language" bind-read-only="!file.editable" on-change="change($event)"></code-editor></div><script setup src="/file-editor.js"></script></template>
<template component="file-preview"><div class="editor-wrap"><code-block bind-code="file.content" bind-language="file.language"></code-block></div><script setup src="/file-preview.js"></script></template>
<template component="file-info"><section class="info-section"><div class="section-head"><span>File details</span></div><div class="file-title"><div class="file-icon">□</div><div><strong>{{ file.path.split('/').pop() }}</strong><div class="muted small">{{ file.language }}</div></div></div><dl class="details"><div><dt>Path</dt><dd>{{ file.path }}</dd></div><div><dt>Size</dt><dd>{{ file.size }} bytes</dd></div><div><dt>Modified</dt><dd>{{ file.modified }}</dd></div><div><dt>Permissions</dt><dd>{{ file.mode.toString(8) }}</dd></div></dl><button class="outline-button" on-click="copy()">Copy path</button></section><script setup src="/file-info.js"></script></template>
<template component="ai-assistant"><section class="assistant"><header class="section-head"><span>✦ File assistant</span><button class="icon" on-click="$$emit('settings')">⚙</button></header><div class="assistant-body"><div class="message">Ask a question about <strong>{{ file?.path }}</strong>.</div><template if="answer"><div class="message">{{ answer }}</div></template></div><div class="assistant-input"><textarea ref="input" placeholder="Ask about this file..." on-keydown="key($event)"></textarea><div class="assistant-actions"><span>⌘ ↵</span><button class="send" on-click="ask()">↑</button></div></div></section><script setup src="/ai-assistant.js"></script></template>
<template component="ai-prompt-modal"><div class="modal-backdrop"><section class="modal"><strong>Assistant system prompt</strong><p class="muted small">This prompt is stored in the local Navi database.</p><textarea bind-value="value" on-input="update($event)"></textarea><div class="modal-actions"><button class="outline-button" on-click="$$emit('close')">Cancel</button><button class="primary" on-click="save()">Save prompt</button></div></section></div><script setup src="/ai-prompt-modal.js"></script></template>
