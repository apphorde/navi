<template component="navi-app">
  <main class="app" class-no-selection="!selected" class-nav-unpinned="!navPinned" class-info-unpinned-layout="!infoPinned">
    <file-nav bind-items="items" bind-open="navOpen" bind-pinned="navPinned" on-pin="toggleNavPin()" on-select="select($event)" on-refresh="loadTree()" on-new-file="newFile()" on-close="closeNav()" bind-user="user"></file-nav>
    <section class="panel workspace">
      <header class="bar"><button class="icon mobile-menu" on-click="openNav()"><lucide-icon icon="menu" size="18" icon-classes="icon-svg"></lucide-icon></button><div class="crumb"><span>data</span><span>/</span><strong>{{ selected?.path || 'Select a file' }}</strong></div><div><button class="icon" on-click="openNav()" aria-label="Open navigation"><lucide-icon icon="search" size="16" icon-classes="icon-svg"></lucide-icon></button><button class="icon mobile-menu" on-click="openInfo()" aria-label="Open details"><lucide-icon icon="info" size="16" icon-classes="icon-svg"></lucide-icon></button></div></header>
      <nav class="tabs"><button class="tab" class-active="mode === 'preview'" on-click="setMode('preview')">Preview</button><button class="tab" class-active="mode === 'editor'" on-click="setMode('editor')">Editor</button></nav>
      <div class="content"><template if="selected"><file-workspace bind-file="selected" bind-mode="mode" on-save="save($event)"></file-workspace></template><template if="!selected"><div class="empty">Select a text file to begin</div></template></div>
      <footer class="status"><span class="saved-dot"></span>{{ saveStatus }}<span>UTF-8</span><span>{{ selected?.lineEnding || 'LF' }}</span><span>{{ selected?.language || '' }}</span></footer>
    </section>
    <template if="selected"><aside class="info-panel" class-info-unpinned="!infoPinned"><div class="panel-pin"><button class="icon" on-click="toggleInfoPin()"><lucide-icon icon="pin" size="14" icon-classes="icon-svg"></lucide-icon></button></div><file-info bind-file="selected"></file-info><template if="aiEnabled"><ai-assistant bind-file="selected" on-settings="showPrompt()"></ai-assistant></template></aside></template>
    <button class="floating-launcher floating-nav-launcher" on-click="openNav()" aria-label="Open file navigation"><lucide-icon icon="menu" size="18" icon-classes="icon-svg"></lucide-icon></button><button class="floating-launcher floating-info-launcher" on-click="openInfo()" aria-label="Open file details"><lucide-icon icon="info" size="18" icon-classes="icon-svg"></lucide-icon></button>
    <template if="promptOpen"><ai-prompt-modal bind-value="prompt" on-close="closePrompt()" on-save="savePrompt($event)"></ai-prompt-modal></template>
  </main>
  <script setup src="/navi-app.js"></script>
</template>

<template component="file-nav">
  <aside class="nav-panel" class-open="open" on-tree-select="forward($event)"><header class="bar"><strong class="brand"><svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h5M8 16h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>Navi</strong><div><button class="icon" on-click="$$emit('pin')"><lucide-icon icon="pin" size="14" icon-classes="icon-svg"></lucide-icon></button><button class="icon close-nav" on-click="$$emit('close')"><lucide-icon icon="x" size="16" icon-classes="icon-svg"></lucide-icon></button></div></header><div class="explorer-head"><span>Explorer</span><div><button class="icon" on-click="$$emit('new-file')" aria-label="New file"><lucide-icon icon="plus" size="14" icon-classes="icon-svg"></lucide-icon></button><button class="icon" on-click="$$emit('refresh')" aria-label="Refresh"><lucide-icon icon="refresh-cw" size="14" icon-classes="icon-svg"></lucide-icon></button></div></div><div class="tree"><template for="item of items"><file-tree-item bind-item="item" attr-data-path="item.path" attr-data-type="item.type" attr-data-name="item.name" attr-data-depth="item.depth"></file-tree-item></template></div><a class="user-card" attr-href="user.authProvider + '/me'" target="_blank" rel="noreferrer"><span class="user-avatar"><template if="user?.photo"><img bind-src="user.photo" attr-alt="user.name"></template><template if="!user?.photo"><span>{{ (user?.name || 'User').slice(0, 1).toUpperCase() }}</span></template></span><span class="user-copy"><strong>{{ user?.name || 'User' }}</strong><small>{{ user?.email || 'Open account profile' }}</small></span><lucide-icon icon="external-link" size="14" icon-classes="icon-svg user-external"></lucide-icon></a></aside>
  <script setup src="/file-nav.js"></script>
</template>

<template component="file-tree-item"><button class="tree-row" style-padding-left="(item.depth * 16 + 12) + 'px'" on-click="select()"><span class="tree-chevron"><template if="item.type === 'directory'"><template if="item.open"><lucide-icon icon="chevron-down" size="13" icon-classes="icon-svg"></lucide-icon></template><template if="!item.open"><lucide-icon icon="chevron-right" size="13" icon-classes="icon-svg"></lucide-icon></template></template></span><template if="item.type === 'directory'"><lucide-icon icon="folder" size="15" icon-classes="icon-svg folder"></lucide-icon></template><template if="item.type !== 'directory'"><lucide-icon icon="file" size="15" icon-classes="icon-svg file"></lucide-icon></template><span>{{ item.name }}</span></button><template if="item.open"><template for="child of item.children"><file-tree-item bind-item="child" attr-data-path="child.path" attr-data-type="child.type" attr-data-name="child.name" attr-data-depth="child.depth"></file-tree-item></template></template><script setup src="/file-tree-item.js"></script></template>

<template component="file-workspace"><div class="editor-wrap"><template if="mode === 'editor'"><file-editor bind-file="file" on-change="$$emit('save', $event)"></file-editor></template><template if="mode === 'preview'"><file-preview bind-file="file"></file-preview></template></div><script setup src="/file-workspace.js"></script></template>
<template component="file-editor"><div class="editor-wrap"><code-editor bind-value="file.content" bind-language="file.language" bind-read-only="!file.editable" on-change="change($event)"></code-editor></div><script setup src="/file-editor.js"></script></template>
<template component="file-preview"><div class="editor-wrap"><code-block bind-code="file.content" bind-language="file.language"></code-block></div><script setup src="/file-preview.js"></script></template>
<template component="file-info"><section class="info-section"><div class="section-head"><span><lucide-icon icon="info" size="14" icon-classes="icon-svg"></lucide-icon> File details</span></div><div class="file-title"><div class="file-icon"><lucide-icon icon="file-code" size="22" icon-classes="icon-svg"></lucide-icon></div><div><strong>{{ file.path.split('/').pop() }}</strong><div class="muted small">{{ file.language }}</div></div></div><dl class="details"><div><dt>Path</dt><dd>{{ file.path }}</dd></div><div><dt>Size</dt><dd>{{ file.size }} bytes</dd></div><div><dt>Modified</dt><dd>{{ file.modified }}</dd></div><div><dt>Permissions</dt><dd>{{ file.mode.toString(8) }}</dd></div></dl><button class="outline-button" on-click="copy()"><lucide-icon icon="copy" size="13" icon-classes="icon-svg"></lucide-icon> Copy path</button></section><script setup src="/file-info.js"></script></template>
<template component="ai-assistant"><section class="assistant"><header class="section-head"><span><lucide-icon icon="sparkles" size="14" icon-classes="icon-svg"></lucide-icon> File assistant</span><button class="icon" on-click="$$emit('settings')"><lucide-icon icon="settings-2" size="14" icon-classes="icon-svg"></lucide-icon></button></header><div class="assistant-body"><div class="message">Ask a question about <strong>{{ file?.path }}</strong>.</div><template if="answer"><div class="message">{{ answer }}</div></template></div><div class="assistant-input"><textarea ref="input" placeholder="Ask about this file..." on-keydown="key($event)"></textarea><div class="assistant-actions"><span>⌘ ↵</span><button class="send" on-click="ask()"><lucide-icon icon="send" size="14" icon-classes="icon-svg"></lucide-icon></button></div></div></section><script setup src="/ai-assistant.js"></script></template>
<template component="ai-prompt-modal"><div class="modal-backdrop"><section class="modal"><strong>Assistant system prompt</strong><p class="muted small">This prompt is stored in the local Navi database.</p><textarea bind-value="value" on-input="update($event)"></textarea><div class="modal-actions"><button class="outline-button" on-click="$$emit('close')">Cancel</button><button class="primary" on-click="save()">Save prompt</button></div></section></div><script setup src="/ai-prompt-modal.js"></script></template>
