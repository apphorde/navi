<template component="navi-app">
  <main
    class="relative grid h-dvh min-h-0 grid-cols-[242px_minmax(0,1fr)_300px] overflow-hidden bg-[#0a0d12] font-mono text-[13px] text-slate-200 max-lg:grid-cols-1 [&>*]:min-h-0"
    class-lg:grid-cols-[242px_minmax(0,1fr)_0px]="navPinned && (!selected || !infoPinned)"
    class-lg:grid-cols-[0px_minmax(0,1fr)_300px]="!navPinned && infoPinned && selected"
    class-lg:grid-cols-[0px_minmax(0,1fr)_0px]="!navPinned && (!selected || !infoPinned)"
  >
    <file-nav
      bind-items="items"
      bind-open="navOpen"
      bind-pinned="navPinned"
      on-pin="toggleNavPin()"
      on-select="select($event)"
      on-refresh="loadTree()"
      on-new-file="newFile()"
      on-close="closeNav()"
      bind-user="user"
    ></file-nav>
    <section class="flex min-w-0 flex-col overflow-hidden bg-[#0b0f15]">
      <header class="flex h-[54px] items-center justify-between border-b border-slate-800 px-[14px]">
        <button
          class="hidden size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 max-lg:grid cursor-pointer"
          on-click="openNav()"
        >
          <lucide-icon icon="menu" size="18" icon-classes="block"></lucide-icon>
        </button>
        <div class="flex min-w-0 gap-2 text-[11px] text-slate-500">
          <span>data</span><span>/</span
          ><strong class="overflow-hidden text-ellipsis whitespace-nowrap font-medium text-slate-50"
            >{{ selected?.path || 'Select a file' }}</strong
          >
        </div>
        <div>
          <button
            class="grid size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
            on-click="openNav()"
            aria-label="Open navigation"
          >
            <lucide-icon icon="search" size="16" icon-classes="block"></lucide-icon></button
          ><button
            class="hidden size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 max-lg:grid cursor-pointer"
            on-click="openInfo()"
            aria-label="Open details"
          >
            <lucide-icon icon="info" size="16" icon-classes="block"></lucide-icon>
          </button>
        </div>
      </header>
      <nav class="flex h-[42px] gap-[18px] border-b border-slate-800 px-[14px]">
        <button
          class="relative text-[11px] text-slate-500 [&.active]:text-slate-50 [&.active]:after:absolute [&.active]:after:inset-x-0 [&.active]:after:-bottom-px [&.active]:after:h-0.5 [&.active]:after:bg-emerald-300 [&.active]:after:content-[''] cursor-pointer"
          class-active="mode === 'preview'"
          on-click="setMode('preview')"
        >
          Preview</button
        ><button
          class="relative text-[11px] text-slate-500 [&.active]:text-slate-50 [&.active]:after:absolute [&.active]:after:inset-x-0 [&.active]:after:-bottom-px [&.active]:after:h-0.5 [&.active]:after:bg-emerald-300 [&.active]:after:content-[''] cursor-pointer"
          class-active="mode === 'editor'"
          on-click="setMode('editor')"
        >
          Editor
        </button>
      </nav>
      <div class="min-h-0 flex-1 overflow-hidden">
        <template if="selected"
          ><file-workspace bind-file="selected" bind-mode="mode" on-save="save($event)"></file-workspace></template
        ><template if="!selected"
          ><div class="grid h-full place-items-center text-slate-500">Select a text file to begin</div></template
        >
      </div>
      <footer
        class="flex min-h-[26px] items-center gap-4 border-t border-slate-800 px-[14px] text-[10px] text-slate-500"
      >
        <span class="size-1.5 rounded-full bg-emerald-300"></span>{{ saveStatus }}<span>UTF-8</span
        ><span>{{ selected?.lineEnding || 'LF' }}</span><span>{{ selected?.language || '' }}</span>
      </footer>
    </section>
    <template if="selected"
      ><aside
        class="relative flex min-h-0 flex-col overflow-hidden border-l border-slate-800 bg-slate-950 max-lg:hidden"
        class-lg:fixed="!infoPinned"
        class-lg:inset-y-0="!infoPinned"
        class-lg:right-0="!infoPinned"
        class-lg:z-25="!infoPinned"
        class-lg:w-[300px]="!infoPinned"
        class-lg:translate-x-0="!infoPinned"
        class-max-lg:fixed="!infoPinned"
        class-max-lg:inset-y-0="!infoPinned"
        class-max-lg:right-0="!infoPinned"
        class-max-lg:z-25="!infoPinned"
        class-max-lg:flex="!infoPinned"
        class-max-lg:w-[min(320px,90vw)]="!infoPinned"
      >
        <div class="absolute right-2 top-[13px] z-[2]">
          <button
            class="grid size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
            on-click="toggleInfoPin()"
          >
            <lucide-icon icon="pin" size="14" icon-classes="block"></lucide-icon>
          </button>
        </div>
        <file-info bind-file="selected"></file-info
        ><template if="aiEnabled"
          ><ai-assistant bind-file="selected" on-settings="showPrompt()"></ai-assistant
        ></template></aside
    ></template>
    <button
      class="fixed bottom-4 left-4 z-40 hidden size-10 place-items-center rounded-full border border-slate-700 bg-emerald-300 text-emerald-950 shadow-xl max-lg:grid cursor-pointer"
      on-click="openNav()"
      aria-label="Open file navigation"
    >
      <lucide-icon icon="menu" size="18" icon-classes="block"></lucide-icon></button
    ><template if="selected"
      ><button
        class="fixed right-4 bottom-4 z-40 hidden size-10 place-items-center rounded-full border border-slate-700 bg-emerald-300 text-emerald-950 shadow-xl max-lg:grid cursor-pointer"
        on-click="openInfo()"
        aria-label="Open file details"
      >
        <lucide-icon icon="info" size="18" icon-classes="block"></lucide-icon></button
    ></template>
    <template if="promptOpen"
      ><ai-prompt-modal bind-value="prompt" on-close="closePrompt()" on-save="savePrompt($event)"></ai-prompt-modal
    ></template>
  </main>
  <script setup src="/navi-app.js"></script>
</template>

<template component="file-nav">
  <aside
    class="relative flex h-full min-h-0 flex-col border-r border-slate-800 bg-slate-950 max-lg:fixed max-lg:inset-y-0 max-lg:left-0 max-lg:z-25 max-lg:w-[min(290px,86vw)] max-lg:-translate-x-[105%] max-lg:transition-transform max-lg:duration-200"
    class-max-lg:translate-x-0="open"
    class-lg:fixed="!pinned"
    class-lg:inset-y-0="!pinned"
    class-lg:left-0="!pinned"
    class-lg:z-25="!pinned"
    class-lg:w-[242px]="!pinned"
    class-lg:-translate-x-[105%]="!pinned && !open"
    class-lg:translate-x-0="!pinned && open"
    on-tree-select="forward($event)"
  >
    <header class="flex h-[54px] items-center justify-between border-b border-slate-800 px-[14px]">
      <strong class="flex items-center font-bold"
        ><svg class="mr-2 h-[22px] w-[22px] align-[-6px]" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M5 4h14v16H5zM8 8h8M8 12h5M8 16h8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path></svg
        >Navi</strong
      >
      <div>
        <button
          class="grid size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
          on-click="$$emit('pin')"
        >
          <lucide-icon icon="pin" size="14" icon-classes="block"></lucide-icon></button
        ><button
          class="grid size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 lg:hidden cursor-pointer"
          on-click="$$emit('close')"
        >
          <lucide-icon icon="x" size="16" icon-classes="block"></lucide-icon>
        </button>
      </div>
    </header>
    <div
      class="flex items-center justify-between px-[14px] pb-2 text-[10px] font-bold tracking-[.12em] text-slate-500 uppercase"
    >
      <span>Explorer</span>
      <div>
        <button
          class="grid size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
          on-click="$$emit('new-file')"
          aria-label="New file"
        >
          <lucide-icon icon="plus" size="14" icon-classes="block"></lucide-icon></button
        ><button
          class="grid size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
          on-click="$$emit('refresh')"
          aria-label="Refresh"
        >
          <lucide-icon icon="refresh-cw" size="14" icon-classes="block"></lucide-icon>
        </button>
      </div>
    </div>
    <div class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto">
      <template for="item of items"
        ><file-tree-item
          bind-item="item"
          attr-data-path="item.path"
          attr-data-type="item.type"
          attr-data-name="item.name"
          attr-data-depth="item.depth"
        ></file-tree-item
      ></template>
    </div>
    <a
      class="mt-auto flex shrink-0 items-center gap-2.5 border-t border-slate-800 px-[14px] py-3 text-slate-200 no-underline hover:bg-slate-900"
      attr-href="user.authProvider + '/me'"
      target="_blank"
      rel="noreferrer"
      ><span
        class="grid size-9 flex-none place-items-center overflow-hidden rounded-full bg-gray-900 text-base font-bold text-slate-50"
        ><template if="user?.photo"
          ><img class="size-full object-cover" bind-src="user.photo" attr-alt="user.name" /></template
        ><template if="!user?.photo"
          ><span>{{ (user?.name || 'User').slice(0, 1).toUpperCase() }}</span></template
        ></span
      ><span class="flex min-w-0 flex-1 flex-col gap-[3px]"
        ><strong>{{ user?.name || 'User' }}</strong><small>{{ user?.email || 'Open account profile' }}</small></span
      ><lucide-icon icon="external-link" size="14" icon-classes="icon-svg user-external"></lucide-icon
    ></a>
  </aside>
  <script setup src="/file-nav.js"></script>
</template>

<template component="file-tree-item"
  ><button
    class="flex h-7 w-full items-center gap-1.5 border-0 bg-transparent pl-3 pr-2 text-left text-[11px] text-slate-300 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
    on-click="select()"
  >
    <span class="grid w-[13px] place-items-center"
      ><template if="item.type === 'directory'"
        ><template if="item.open"
          ><lucide-icon icon="chevron-down" size="13" icon-classes="block"></lucide-icon></template
        ><template if="!item.open"
          ><lucide-icon icon="chevron-right" size="13" icon-classes="block"></lucide-icon></template></template></span
    ><template if="item.type === 'directory'"
      ><lucide-icon icon="folder" size="15" icon-classes="block text-amber-300"></lucide-icon></template
    ><template if="item.type !== 'directory'"
      ><lucide-icon icon="file" size="15" icon-classes="block text-blue-300"></lucide-icon></template
    ><span>{{ item.name }}</span>
  </button>
  <div class="hidden pl-4 [&.open]:block" class-open="item.open">
    <template for="child of item.children"
      ><file-tree-item
        bind-item="child"
        attr-data-path="child.path"
        attr-data-type="child.type"
        attr-data-name="child.name"
        attr-data-depth="child.depth"
      ></file-tree-item
    ></template>
  </div>
  <script setup src="/file-tree-item.js"></script
></template>

<template component="file-workspace"
  ><div class="h-full min-h-0 max-h-full overflow-auto">
    <template if="mode === 'editor'"
      ><file-editor bind-file="file" on-change="$$emit('save', $event.detail ?? $event)"></file-editor></template
    ><template if="mode === 'preview'"><file-preview bind-file="file"></file-preview></template>
  </div>
  <script setup src="/file-workspace.js"></script
></template>
<template component="file-editor"
  ><div class="h-full min-h-0 max-h-full overflow-auto">
    <code-editor
      bind-value="file.content"
      bind-language="file.language"
      bind-read-only="!file.editable"
      on-change="change($event)"
    ></code-editor>
  </div>
  <script setup src="/file-editor.js"></script
></template>
<template component="file-preview"
  ><div class="h-full min-h-0 max-h-full overflow-auto">
    <code-block bind-source="file.content" bind-language="file.language"></code-block>
  </div>
  <script setup src="/file-preview.js"></script
></template>
<template component="file-info"
  ><section class="border-b border-slate-800 p-[14px]">
    <div
      class="flex items-center justify-between px-[14px] pb-2 text-[10px] font-bold tracking-[.12em] text-slate-500 uppercase [&>span]:flex [&>span]:items-center [&>span]:gap-1.5"
    >
      <span><lucide-icon icon="info" size="14" icon-classes="block"></lucide-icon> File details</span>
    </div>
    <div class="my-4 flex items-center gap-2.5">
      <div class="grid size-9 place-items-center rounded-lg bg-blue-950 text-blue-400">
        <lucide-icon icon="file-code" size="22" icon-classes="block"></lucide-icon>
      </div>
      <div>
        <strong>{{ file.path.split('/').pop() }}</strong>
        <div class="text-[10px] text-slate-500">{{ file.language }}</div>
      </div>
    </div>
    <dl
      class="my-0 text-[11px] [&>div]:flex [&>div]:justify-between [&>div]:gap-3 [&>div]:border-t [&>div]:border-slate-800 [&>div]:py-[9px] [&_dd]:m-0 [&_dd]:max-w-[180px] [&_dd]:text-right [&_dd]:[overflow-wrap:anywhere] [&_dt]:text-slate-500"
    >
      <div>
        <dt>Path</dt>
        <dd>{{ file.path }}</dd>
      </div>
      <div>
        <dt>Size</dt>
        <dd>{{ file.size }} bytes</dd>
      </div>
      <div>
        <dt>Modified</dt>
        <dd>{{ file.modified }}</dd>
      </div>
      <div>
        <dt>Permissions</dt>
        <dd>{{ file.mode.toString(8) }}</dd>
      </div>
    </dl>
    <button
      class="inline-flex items-center gap-1.5 rounded-md border border-slate-800 bg-transparent px-2.5 py-1.5 text-[10px] text-slate-400 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
      on-click="copy()"
    >
      <lucide-icon icon="copy" size="13" icon-classes="block"></lucide-icon> Copy path
    </button>
  </section>
  <script setup src="/file-info.js"></script
></template>
<template component="ai-assistant"
  ><section class="flex min-h-0 flex-1 flex-col">
    <header
      class="flex items-center justify-between px-[14px] pb-2 text-[10px] font-bold tracking-[.12em] text-slate-500 uppercase [&>span]:flex [&>span]:items-center [&>span]:gap-1.5"
    >
      <span><lucide-icon icon="sparkles" size="14" icon-classes="block"></lucide-icon> File assistant</span
      ><button
        class="grid size-7 place-items-center rounded-md border-0 bg-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
        on-click="$$emit('settings')"
      >
        <lucide-icon icon="settings-2" size="14" icon-classes="block"></lucide-icon>
      </button>
    </header>
    <div class="min-h-0 flex-1 overflow-auto p-4">
      <div class="text-xs leading-relaxed whitespace-pre-wrap">
        Ask a question about <strong>{{ file?.path }}</strong>.
      </div>
      <template if="answer"><div class="text-xs leading-relaxed whitespace-pre-wrap">{{ answer }}</div></template>
    </div>
    <div class="m-3 rounded-md border border-slate-700 bg-slate-900">
      <textarea
        class="block h-[54px] w-full resize-none border-0 bg-transparent p-2.5 text-[11px] text-inherit outline-0"
        ref="input"
        placeholder="Ask about this file..."
        on-keydown="key($event)"
      ></textarea>
      <div class="flex justify-between px-2 pb-2 text-slate-500">
        <span>⌘ ↵</span
        ><button
          class="size-6 rounded-md bg-emerald-300 text-emerald-950 hover:bg-emerald-200 cursor-pointer"
          on-click="ask()"
        >
          <lucide-icon icon="send" size="14" icon-classes="block"></lucide-icon>
        </button>
      </div>
    </div>
  </section>
  <script setup src="/ai-assistant.js"></script
></template>
<template component="ai-prompt-modal"
  ><div class="fixed inset-0 z-30 grid place-items-center bg-black/50">
    <section
      class="w-[min(560px,calc(100vw-30px))] rounded-lg border border-slate-700 bg-slate-900 p-[18px] shadow-2xl"
    >
      <strong>Assistant system prompt</strong>
      <p class="text-[10px] text-slate-500">This prompt is stored in the local Navi database.</p>
      <textarea
        class="my-3 min-h-[180px] w-full rounded border border-slate-700 bg-slate-950 p-2.5 text-inherit outline-0"
        bind-value="value"
        on-input="update($event)"
      ></textarea>
      <div class="flex justify-end gap-2">
        <button
          class="inline-flex items-center gap-1.5 rounded-md border border-slate-800 bg-transparent px-2.5 py-1.5 text-[10px] text-slate-400 hover:bg-slate-800 hover:text-slate-50 cursor-pointer"
          on-click="$$emit('close')"
        >
          Cancel</button
        ><button
          class="rounded bg-emerald-300 px-3 py-[7px] text-emerald-950 hover:bg-emerald-200 cursor-pointer"
          on-click="save()"
        >
          Save prompt
        </button>
      </div>
    </section>
  </div>
  <script setup src="/ai-prompt-modal.js"></script
></template>
